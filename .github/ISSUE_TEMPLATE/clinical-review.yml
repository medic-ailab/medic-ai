name: Clinical review
description: For doctors and medical practitioners. Suggest a change to a MEDIC AI answer, or a recommendation.
title: "Clinical review: "
labels: ["clinical-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **This form is public.** Don't include patient details, and don't post your registration number here. We'll arrange to confirm your registration privately.
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Doctor
        - Nurse or nurse practitioner
        - Pharmacist
        - Mental health professional
        - Other registered healthcare professional
    validations:
      required: true
  - type: input
    id: specialty
    attributes:
      label: Your specialty
      placeholder: Emergency medicine
    validations:
      required: false
  - type: input
    id: country
    attributes:
      label: Country you practise in
      description: Guidance and emergency numbers differ between countries.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The answer you're reviewing
      description: Leave this empty if you're making a general recommendation.
    validations:
      required: false
  - type: dropdown
    id: concern
    attributes:
      label: How serious is the problem?
      options:
        - Unsafe. It could delay care or cause harm.
        - Inaccurate or out of date
        - Missing a danger sign or important advice
        - Could be clearer
        - General recommendation
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Your recommendation
      description: What should it say or do instead? Include the exact wording if you can.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Guideline or source
      description: A published guideline or reference, if there's one.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I'm a registered healthcare professional.
          required: true
        - label: I haven't included any patient details.
          required: true
